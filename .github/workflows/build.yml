name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=1g"

jobs:
  build:
    name: Build, test, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check and verify plugin
        run: ./gradlew check verifyPlugin

      - name: Upload plugin archive
        uses: actions/upload-artifact@v6
        with:
          name: simple-icons-${{ github.sha }}
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload plugin verifier reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: plugin-verifier-${{ github.sha }}
          path: build/reports/pluginVerifier
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: failed-tests-${{ github.sha }}
          path: build/reports/tests
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage
        if: success()
        uses: codecov/codecov-action@v7
        with:
          files: build/reports/kover/report.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  qodana:
    name: Qodana
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: write

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Check out sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Qodana
        uses: JetBrains/qodana-action@v2026.1.3
        with:
          cache-default-branch-only: true
